<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title> Radar de Quesitos </title>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        h1, p {
            color: white;
            text-align: center;
            font-family: Arial;
        }
    </style>
</head>

<body>
    <h1>Bienvenido al Radar de quesitos </h1>
    <canvas id="radar"></canvas>

    <script>
    // Ajustar canvas
    const canvas = document.getElementById("radar");
    const ctx = canvas.getContext("2d");

    function ajustar() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    ajustar();
    window.onresize = ajustar;

    // Cargar imágenes reales de quesos
    const img1 = new Image();
    img1.src = "queso 1.jpg";

    const img2 = new Image();
    img2.src = "queso 2.jpg";

    const img3 = new Image();
    img3.src = "queso 3.jpg";

    const img4 = new Image();
    img4.src = "queso 4.jpg";

    // Quesos con coordenadas e imagen
    const quesos = [
        { nombre: "Queso 1", x: 120, y: -80, img: img1 },
        { nombre: "Queso 2", x: -150, y: 60, img: img2 },
        { nombre: "Queso 3", x: 90, y: 140, img: img3 },
        { nombre: "Queso 4", x: -100, y: -130, img: img4 }
    ];

    // Radar
    let angulo = 0;

    function dibujar() {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // Fondo
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Círculos del radar
        ctx.strokeStyle = "#00ff00";
        ctx.lineWidth = 2;
        for (let r = 50; r <= 300; r += 50) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Línea de barrido
        const rad = angulo * Math.PI / 180;
        const finX = cx + Math.cos(rad) * 300;
        const finY = cy + Math.sin(rad) * 300;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(finX, finY);
        ctx.stroke();

        // Dibujar quesos con imagen real
        for (const q of quesos) {
            const qx = cx + q.x;
            const qy = cy + q.y;

            const dx = qx - cx;
            const dy = qy - cy;
            let angQ = Math.atan2(dy, dx) * 180 / Math.PI;
            if (angQ < 0) angQ += 360;

            const dif = Math.abs((angulo - angQ + 180) % 360 - 180);

            const size = 70; // tamaño del queso

            if (dif < 5) {
                ctx.filter = "drop-shadow(0 0 25px red)";
                ctx.drawImage(q.img, qx - size/2, qy - size/2, size, size);
                ctx.filter = "none";
            } else {
                ctx.drawImage(q.img, qx - size/2, qy - size/2, size, size);
            }
        }

        angulo = (angulo + 2) % 360;
        requestAnimationFrame(dibujar);
    }

    dibujar();
    </script>
</body>
</html>
