<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Detector de Quesazos</title>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        h1, p {
            color: white;
            text-align: center;
            font-family: Arial;
        }
    </style>
</head>

<body>
    <h1>Bienvenido al Detector de Quesazos</h1>
    <p>Tu radar se instalará aquí.</p>

    <canvas id="radar"></canvas>

    <!-- SONIDO -->
    <audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

    <script>
    // Ajustar canvas
    const canvas = document.getElementById("radar");
    const ctx = canvas.getContext("2d");

    function ajustar() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    ajustar();
    window.onresize = ajustar;

    // Cargar imágenes reales de quesos
    const img1 = new Image(); img1.src = "queso_1.jpg";
    const img2 = new Image(); img2.src = "queso_2.jpg";
    const img3 = new Image(); img3.src = "queso_3.jpg";
    const img4 = new Image(); img4.src = "queso_4.jpg";
    const img5 = new Image(); img5.src = "queso5.jpg";
    const img6 = new Image(); img6.src = "queso6.jpg";
    const img7 = new Image(); img7.src = "queso7.jpg";

    // Lista de quesos con coordenadas
    const quesos = [
        { nombre: "Queso 1", x: 250, y: -200, img: img1 },
        { nombre: "Queso 2", x: -300, y: 150, img: img2 },
        { nombre: "Queso 3", x: 200, y: 300, img: img3 },
        { nombre: "Queso 4", x: -250, y: -250, img: img4 },
        { nombre: "Queso 5", x: 350, y: -80, img: img5 },
        { nombre: "Queso 6", x: -380, y: 220, img: img6 },
        { nombre: "Queso 7", x: 0, y: -350, img: img7 }
    ];

    // Sonido
    const beep = document.getElementById("beep");

    // Radar
    let angulo = 0;

    function dibujar() {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // Fondo
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Círculos del radar (radio más grande)
        ctx.strokeStyle = "#00ff00";
        ctx.lineWidth = 2;
        for (let r = 100; r <= 600; r += 50) {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Línea de barrido
        const rad = angulo * Math.PI / 180;
        const finX = cx + Math.cos(rad) * 600;
        const finY = cy + Math.sin(rad) * 600;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(finX, finY);
        ctx.stroke();

        // Dibujar quesos
        for (const q of quesos) {
            const qx = cx + q.x;
            const qy = cy + q.y;

            const dx = qx - cx;
            const dy = qy - cy;
            let angQ = Math.atan2(dy, dx) * 180 / Math.PI;
            if (angQ < 0) angQ += 360;

            const dif = Math.abs((angulo - angQ + 180) % 360 - 180);

            const size = 90; // tamaño del queso

            if (dif < 5) {
                ctx.filter = "drop-shadow(0 0 40px red)";
                ctx.drawImage(q.img, qx - size/2, qy - size/2, size, size);
                ctx.filter = "none";

                beep.currentTime = 0;
                beep.play();
            } else {
                ctx.drawImage(q.img, qx - size/2, qy - size/2, size, size);
            }
        }

        angulo = (angulo + 2) % 360;
        requestAnimationFrame(dibujar);
    }

    dibujar();
    </script>
</body>
</html>
